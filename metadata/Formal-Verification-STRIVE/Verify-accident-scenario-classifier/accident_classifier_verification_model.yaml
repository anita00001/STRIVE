name: STRIVE Accident Scenario Classifier Verification
version: 1.0.0
status: complete_specification
formal_verification_status: not_run
verified_claims: []
falsified_claims: []
assurance_approach: Verify the accident scenario classifier
target:
  type: paper-level learned binary mode classifier
  classes:
  - regular
  - accident-prone
  public_m04_is_same_target: false
  original_public_source_identified: false
  original_public_checkpoint_identified: false
