c01:
  initialization: posterior mean
  initial_fit_iterations: 75
  initial_fit_learning_rate: 0.1
  rule_based_second_fit_iterations: 100
  rule_based_second_fit_learning_rate: 0.05
c02:
  role: native adversarial collision search
  learning_rate: 0.05
  rule_based_iterations: 200
  replay_iterations: 300
  early_stopping: false
  native_final_success: planner-vs-other polygon collision
  native_collision_iou_threshold: 0.02
  native_collision_buffer_for_loss: 0.1
  search_is_complete: false
  native_success_equals_external_spec_violation: false
c03:
  role: operational search for collision-free planner response
  native_collision_buffer: 0.5
  success_requires:
  - no planner-other collision
  - no planner-environment collision
  success_is_formal_solvability_proof: false
  failure_is_formal_unsolvability_proof: false
planner_paths:
  replay:
    ego_future: recorded future
    planner_reacts_to_generated_traffic: false
  rule_based:
    planner: M-02 HardcodeNuscPlanner
    planner_reacts_to_generated_traffic: true
    planning_dt_seconds: 0.2
traffic_timebase:
  m01_dt_seconds: 0.5
formal_falsification_semantics:
  counterexample: reloadable STRIVE-generated trajectory independently confirmed to violate the exact versioned external safety
    specification
  no_counterexample_found_means_safe: false
  native_strive_success_is_candidate_evidence: true
  independent_property_replay_required: true
required_specification_fields:
- property_id
- version
- signal definition
- agent scope
- thresholds
- units
- temporal semantics
- horizon
- interpolation
- vehicle geometry
- numeric tolerance
- evaluator revision/hash
- source/rationale
search_variables:
- target/planner-related M-01 latent variables
- other-agent M-01 latent variables
- selected attack agent
recommended_outcomes:
- counterexample
- no_counterexample_found
- invalid_candidate
- timeout
- error
validation_requirements:
- reproduce native STRIVE generation before modification
- unit-test each external specification evaluator
- validate geometry semantics
- validate cross-timebase interpolation
- replay every final counterexample from serialized trajectory
- cross-tab native STRIVE and external specification outcomes
limitations:
- Falsification is incomplete; no violation found is not proof of safety.
- C-02 is nonconvex local optimization and may miss violations.
- Search coverage inherits M-01 learned-prior bias.
- Counterexamples are planner/configuration-specific.
- TTC/separation examples are incomplete until exact semantics are frozen.
- Discrete-time evaluation can miss between-sample violations.
- Generated counterexamples are synthetic stress tests, not real-world frequency estimates.
- C-03 does not provide a global solvability/unsolvability proof.
