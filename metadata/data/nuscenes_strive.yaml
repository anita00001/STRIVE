      drivable-area raster is at least 0.30 and overlap with the carpark-area
      raster is less than 0.30.

    dropped_track: >
      A raw non-ego track for which no usable postprocessed track remains after
      STRIVE preprocessing.

    postprocessed_visible_state_frame: >
