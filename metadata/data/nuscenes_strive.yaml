schema_version: "0.1"

dataset:
  id: "D-01"
  name: "STRIVE nuScenes-Derived Traffic Dataset"
  upstream_dataset: "nuScenes"
  upstream_version: "trainval"
  associated_system: "STRIVE"

scope:
  primary_model: "car-truck traffic model"
  status: "in-progress"

source:
  repository: "nv-tlabs/STRIVE"
  commit: "b708951f8665c97a1de9ed93b4ed3f58dd8cbf5d"
  paper: "Generating Useful Accident-Prone Driving Scenarios via a Learned Traffic Prior"

agents:
  main_model_categories:
    - car
    - truck

temporal:
  frequency_hz: 2.0
  timestep_seconds: 0.5
  past_seconds: 2.0
  past_steps: 4
  future_seconds: 6.0
  future_steps: 12

agent_state:
  fields:
    - x
    - y
    - heading_x
    - heading_y
    - speed
    - heading_rate
  attributes:
    - length
    - width

map:
  crop_pixels:
    width: 256
    height: 256
  pixels_per_meter: 4
  layers:
    - drivable_area
    - carpark_area
    - road_divider
    - lane_divider

preprocessing:
  singapore_x_flip:
    enabled: true
    repository_default: true

  finite_difference_motion_features: true

  require_full_past:
    repository_default: false

  drivable_overlap_filter:
    enabled: true
    threshold_fraction: 0.30

splits:
  paper_reported_training:
    source: "nuScenes prediction challenge training split"

  repository_default:
    use_challenge_splits: false
    sample_semantics: "scene temporal window"

    train:
      scenes: 500
      scene_window_samples: 12191

    validation:
      scenes: 200
      scene_window_samples: 4739

    totals:
      scenes: 700
      scene_window_samples: 16930

    evidence_status: "programmatically-computed"

  prediction_challenge_mode:
    use_challenge_splits: true
    sample_semantics: "prediction target agent/sample pair"

    strive_to_challenge_mapping:
      train: "train"
      validation: "train_val"
      test: "val"

    train:
      scenes: 500
      prediction_target_samples: 29884

    validation:
      scenes: 200
      prediction_target_samples: 7705

    totals:
      scenes: 700
      prediction_target_samples: 37589

    evidence_status: "programmatically-computed"

  released_checkpoint:
    exact_dataset_construction_verified: false

statistics:
  source_scenes: null
  training_sequences: null
  validation_sequences: null
  total_agent_instances: null
  cars: null
  trucks: null
  boston_sequences: null
  singapore_sequences: null
  mean_agents_per_scene: null
  median_agents_per_scene: null
  filtered_samples: null
  car_agent_instances: null
  truck_agent_instances: null
  mean_agents_per_sample: null
  median_agents_per_sample: null
  boston_samples: null
  singapore_samples: null
  incomplete_history_frequency: null
  filtered_frames_or_samples: null

scenario_generation:
  reported_initial_scenarios: 1200
  scenario_length_seconds: 8
  exact_reproduced_count: null

provenance:
  paper_verified: true
  repository_verified: true
  artifact_verified: false
  statistics_computed: false

evidence:
  repository_commit:
    value: "b708951f8665c97a1de9ed93b4ed3f58dd8cbf5d"
    status: "repository-verified"

  main_agent_categories:
    value:
      - car
      - truck
    status: "paper-and-repository-verified"

  timestep_seconds:
    value: 0.5
    status: "repository-verified"

  map_resolution_pixels:
    value: 256
    status: "paper-and-repository-verified"

  pixels_per_meter:
    value: 4
    status: "paper-and-repository-verified"

  released_checkpoint_training_split:
    value: null
    status: "not-yet-verified"

licenses:
  upstream: null
  derived_models_and_released_scenarios: "CC-BY-NC-SA-4.0"
  verification_required: true