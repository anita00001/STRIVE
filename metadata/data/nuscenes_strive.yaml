schema_version: "0.1"

dataset:
  id: "D-01"
  name: "STRIVE nuScenes-Derived Traffic Dataset"
  upstream_dataset: "nuScenes"
  upstream_version: "trainval"
  associated_system: "STRIVE"

scope:
  primary_model: "car-truck traffic model"
  status: "complete"

source:
  repository: "nv-tlabs/STRIVE"
  commit: "b708951f8665c97a1de9ed93b4ed3f58dd8cbf5d"
  paper: "Generating Useful Accident-Prone Driving Scenarios via a Learned Traffic Prior"

# -------------------------------------------------------------------
# upstream nuScenes provenance
# -------------------------------------------------------------------
upstream:
  dataset:
    name: "nuScenes"
    provider: "Motional"
    version_used_by_strive: "v1.0-trainval"

  official_dataset_characteristics:
    total_scenes: 1000
    seconds_per_scene: 20
    locations:
      - Boston
      - Singapore

  canonical_publication:
    title: "nuScenes: A Multimodal Dataset for Autonomous Driving"
    authors:
      - Holger Caesar
      - Varun Bankiti
      - Alex H. Lang
      - Sourabh Vora
      - Venice Erin Liong
      - Qiang Xu
      - Anush Krishnan
      - Yu Pan
      - Giancarlo Baldan
      - Oscar Beijbom
    venue: "IEEE/CVF Conference on Computer Vision and Pattern Recognition (CVPR)"
    year: 2020
    pages: "11621-11631"

  strive_consumed_data:
    sample_metadata: true
    ego_pose: true

    sample_annotations:
      translation: true
      rotation: true
      size: true
      category: true
      instance_token: true

    semantic_maps: true

    map_layers_used:
      - drivable_area
      - carpark_area
      - road_divider
      - lane_divider

    prediction_challenge_metadata:
      used_when_use_challenge_splits_true: true
      prediction_scenes_metadata: true

    raw_sensor_measurements_as_model_features:
      value: false
      description: >
        The STRIVE traffic dataset construction reviewed here derives agent
        trajectories, ego poses, semantic categories, vehicle dimensions, and
        semantic-map information from nuScenes metadata and annotations.
        Raw camera, lidar, and radar measurements are not supplied as traffic
        model input features.

  evidence_status:
    dataset_identity: "official-source-verified"
    strive_usage: "repository-verified"


# -------------------------------------------------------------------
# Agent categories
# -------------------------------------------------------------------

agents:
  main_model_categories:
    - car
    - truck


# -------------------------------------------------------------------
# Temporal representation
# -------------------------------------------------------------------

temporal:
  frequency_hz: 2.0
  timestep_seconds: 0.5

  past:
    seconds: 2.0
    steps: 4

  future:
    seconds: 6.0
    steps: 12

  total_window_seconds: 8.0
  total_steps: 16


# -------------------------------------------------------------------
# Agent representation
# -------------------------------------------------------------------

agent_state:
  fields:
    - x
    - y
    - heading_x
    - heading_y
    - speed
    - heading_rate

  attributes:
    - length
    - width

# -------------------------------------------------------------------
# Model-facing tensor representation
# -------------------------------------------------------------------

model_input_schema:
  notation:
    N: "number of agents/nodes in the current scene graph"
    P: 4
    F: 12
    D_state: 6
    D_attribute: 2
    D_semantic: 2

  tensors:
    past:
      shape: "[N, 4, 6]"
      dtype: "float"
      normalized: true
      description: >
        Past agent state sequence. During traffic-model training this tensor
        may contain Gaussian perturbation after normalization.

    past_gt:
      shape: "[N, 4, 6]"
      dtype: "float"
      normalized: true
      description: >
        Clean normalized past state sequence retained without training-time
        Gaussian perturbation.

    future:
      shape: "[N, 12, 6]"
      dtype: "float"
      normalized: true
      description: >
        Future state sequence supplied to the CVAE posterior encoder during
        training. Training samples may contain Gaussian perturbation after
        normalization.

    future_gt:
      shape: "[N, 12, 6]"
      dtype: "float"
      normalized: true
      description: >
        Clean normalized future trajectory used for reconstruction/error
        computation.

    sem:
      shape: "[N, 2]"
      dtype: "float"
      encoding: "one-hot"
      categories:
        - car
        - truck
      description: >
        Semantic category vector for each graph node. The ego vehicle is
        represented using the car semantic category.

    lw:
      shape: "[N, 2]"
      dtype: "float"
      normalized: true
      fields:
        - length
        - width
      description: >
        Vehicle dimensions. Training samples may contain Gaussian
        perturbation after normalization.

    past_vis:
      shape: "[N, 4]"
      dtype: "float"
      values:
        - 0
        - 1
      description: "Visibility/validity mask for past trajectory states."

    future_vis:
      shape: "[N, 12]"
      dtype: "float"
      values:
        - 0
        - 1
      description: "Visibility/validity mask for future trajectory states."

    edge_index:
      shape: "[2, E]"
      dtype: "int64"
      description: >
        Directed fully connected graph edges excluding self-edges.

    x:
      shape: "[N]"
      status: "uninitialized-placeholder"
      description: >
        Placeholder tensor allocated with torch.empty by the dataset loader.
        Its contents are unspecified and should not be interpreted as an
        underlying dataset feature.

    pos:
      shape_at_dataset_return: "[N]"
      status: "uninitialized-placeholder-at-dataset-return"
      description: >
        Placeholder tensor allocated with torch.empty by the dataset loader.
        TrafficModel.forward replaces it with past[:, -1, :4] before map
        feature extraction.

  returned_separately:
    map_idx:
      type: "integer"
      description: >
        Index identifying the nuScenes map for the sample. In a minibatch these
        indices are collated and used by NuScenesMapEnv to obtain local map
        observations.


# -------------------------------------------------------------------
# Scene graph construction
# -------------------------------------------------------------------

scene_graph:
  connectivity: "directed fully connected without self-edges"

  edge_count:
    formula: "N * (N - 1)"

  agent_inclusion_rule:
    description: >
      An agent is included in a dataset sample only when its state is valid at
      the final timestep of the past window. Earlier past states and future
      states may still be unavailable.

  node_ordering:
    repository_default:
      node_0: "ego"

    prediction_challenge_mode:
      node_0: "prediction target"
      node_1: "ego"

  ego_semantic_category: "car"


# -------------------------------------------------------------------
# Normalization
# -------------------------------------------------------------------

normalization:
  method: "(value - mean) / standard_deviation"
  statistics_source: "src/datasets/utils.py::NUSC_NORM_STATS"

  car_truck_state:
    x:
      mean: 0.0
      std: 15.0

    y:
      mean: 0.0
      std: 15.0

    heading_x:
      mean: 0.0
      std: 1.0

    heading_y:
      mean: 0.0
      std: 1.0

    speed:
      mean: 1.802009
      std: 3.507907

    heading_rate:
      mean: -0.000037
      std: 0.055684

  car_truck_vehicle_attributes:
    length:
      mean: 4.844294
      std: 1.084860

    width:
      mean: 2.021752
      std: 0.299647

  evidence_status: "repository-verified"

  notes:
    - >
      These constants are defined directly in the public STRIVE repository.
    - >
      The present documentation has not independently reconstructed the
      dataset procedure originally used by the authors to estimate these
      constants.

# -------------------------------------------------------------------
# Training-time data augmentation
# -------------------------------------------------------------------

training_time_augmentation:
  current_train_config:
    source: "configs/train_traffic.cfg"
    gaussian_noise_std: 0.01
    noise_space: "normalized feature space"

  training_dataset:
    past:
      gaussian_noise: true

    future:
      gaussian_noise: true

    vehicle_attributes:
      gaussian_noise: true

    past_gt:
      gaussian_noise: false

    future_gt:
      gaussian_noise: false

    post_noise_constraints:
      heading_vectors:
        description: >
          The heading_x and heading_y components are renormalized to unit
          length after Gaussian perturbation.

      positions:
        description: >
          The first two normalized state components are clamped to a minimum
          value of 0.0 after perturbation.

  validation_dataset:
    gaussian_noise: false
    description: >
      train_traffic.py passes data_noise_std to the training dataset but not
      to the validation dataset; validation therefore uses the dataset
      constructor default noise_std=0.0.

  evidence_status: "repository-verified"

# -------------------------------------------------------------------
# Map representation
# -------------------------------------------------------------------

map:
  local_crop:
    pixels:
      width: 256
      height: 256

    bounds_m:
      behind: -17.0
      left: -38.5
      front: 60.0
      right: 38.5

  base_raster:
    pixels_per_meter: 4

  layers:
    - drivable_area
    - carpark_area
    - road_divider
    - lane_divider


# -------------------------------------------------------------------
# STRIVE preprocessing
# -------------------------------------------------------------------

preprocessing:
  singapore_x_flip:
    enabled: true
    repository_default: true
    description: >
      Singapore maps and trajectories are flipped about the x-axis so that
      their driving direction is represented consistently with right-hand
      traffic in the STRIVE data representation.

  finite_difference_motion_features:
    enabled: true
    description: >
      Speed and heading-rate quantities are derived from trajectory data
      using finite-difference operations in the STRIVE preprocessing code.

  require_full_past:
    repository_default: false
    description: >
      Non-ego agents are not required to have a complete four-step past
      history by default. An agent can be retained when earlier past frames
      are missing as long as the required current/past-end state is valid.

  spatial_frame_filter:
    enabled: true

    drivable_area:
      minimum_overlap_fraction: 0.30

    carpark_area:
      maximum_overlap_fraction_exclusive: 0.30

    challenge_target_exception:
      description: >
        For agents required by the prediction-challenge split, the repository
        bypasses the ordinary drivable-area/carpark spatial filtering so that
        required prediction targets are retained.


