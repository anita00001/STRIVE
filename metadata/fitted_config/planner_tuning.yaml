  tuned_max_speed_change_percent: 33.3333333333
  tuned_max_acceleration_change_percent: 33.3333333333
paper_tuning:
  search_type: exhaustive hyperparameter sweep
  combination_count: 432
  selection_primary: lowest collision rate
  selection_tiebreak: lowest acceleration
  initial_regular_scenarios: 800
  initial_regular_scenario_duration_seconds: 8
  initial_regular_source: nuScenes train/validation splits
  challenging_scenarios_generated_against:
  - default rule-based planner
  - regular-tuned rule-based planner
  behind_collisions_removed_for_challenging_tuning: true
  search_ranges_reported:
    p_max:
    - 0.05
    - 0.2
    max_speed_m_per_s:
    - 12.5
    - 20.0
    max_acceleration_m_per_s2:
    - 3.0
    - 4.5
    additional: parameters related to computing p_col(trajectory)
  full_discrete_grid_released_in_repo: false
  dedicated_sweep_implementation_identified_in_public_repo: false
  evaluation_split: held-out nuScenes test set
  collision_eval_excludes_scenarios_where_all_hyperparameter_settings_collide: true
  regular_oracle_best_collision_percent: 3.2
