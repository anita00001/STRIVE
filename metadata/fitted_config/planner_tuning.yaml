accident_mode_classifier:
  paper_described: true
  public_repo_implementation_identified: false
  task: binary regular vs accident-prone scene classification
  history_seconds: 2
  architecture_summary: Traffic-model-like trajectory/map encoders and scene-graph message passing; 64-D ego feature
    to 2-layer MLP.
  training_data: regular nuScenes training scenes plus over 1000 generated collision scenarios from train/validation
    scenes using Replay and Rule-based planner variations
  loss: class-imbalance-weighted binary cross entropy
evaluation:
  script: src/eval_planner.py
  default_config: configs/eval_planner.cfg
  default_eval_config_matches_DEF_CONFIG: true
  default_scenario_dir: ./out/adv_gen_rule_based_out/scenario_results/adv_sol_success
  matched_regular_scenarios_default: true
  metrics:
  - collision rate
  - relative collision velocity
  - acceleration
  - forward acceleration
  - lateral acceleration
reproducibility_notes:
- The public repository exposes final_tuned_val_1 but not the full 432-trial sweep implementation.
- The repository does not explicitly map final_tuned_val_1 to one specific Table 3 row.
- The paper's learned binary accident-mode classifier is described in supplementary material but was not identified in
  the public repository.
- configs/eval_planner.cfg contains default planner values, not final_tuned_val_1 values.
profile:
  profiler: tools/profile_planner_tuning.py
  measurement_status: not_run
  measured: null
  expected_measured_fields:
  - source_files
  - extracted_configs
  - config_delta
  - derived_properties
  - release_behavior
  - quality_checks
